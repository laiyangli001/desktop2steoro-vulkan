name: Build native launchers

on:
  workflow_dispatch:
  push:
    paths:
      - "native/launcher/**"
      - "src/desktop2stereo/auth/**"
      - "src/desktop2stereo/app_runtime/**"
      - "src/desktop2stereo/main.py"
      - "scripts/install-public-key.mjs"
      - "scripts/write-release-manifest.mjs"
      - ".github/workflows/build-native-launcher.yml"

jobs:
  windows-launcher:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure
        run: cmake -S native/launcher/windows -B build/native-launcher -A x64

      - name: Build
        run: cmake --build build/native-launcher --config Release --parallel

      - name: Package launcher
        shell: pwsh
        env:
          D2S_LICENSE_PUBLIC_KEY_JSON: ${{ vars.D2S_LICENSE_PUBLIC_KEY_JSON }}
        run: |
          if (-not $env:D2S_LICENSE_PUBLIC_KEY_JSON) { throw "Repository variable D2S_LICENSE_PUBLIC_KEY_JSON is required for release packaging." }
          node scripts/install-public-key.mjs src/desktop2stereo/auth/public_keys.py
          New-Item -ItemType Directory -Force -Path dist/Desktop2Stereo/src/desktop2stereo | Out-Null
          Copy-Item build/native-launcher/Release/Desktop2Stereo.exe dist/Desktop2Stereo/src/
          Copy-Item src/desktop2stereo/main.py dist/Desktop2Stereo/src/desktop2stereo/
          Copy-Item src/desktop2stereo/app_runtime,src/desktop2stereo/auth,src/desktop2stereo/gui,src/desktop2stereo/gui2 dist/Desktop2Stereo/src/desktop2stereo/ -Recurse
          Copy-Item src/desktop2stereo/d2s_blur.png dist/Desktop2Stereo/src/desktop2stereo/
          Copy-Item native/launcher/windows/README.md dist/Desktop2Stereo/
          node scripts/write-release-manifest.mjs dist/Desktop2Stereo

      - name: Upload Windows launcher
        uses: actions/upload-artifact@v4
        with:
          name: Desktop2Stereo-windows-launcher-${{ github.sha }}
          path: dist/Desktop2Stereo

  linux-launcher:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install launcher dependencies
        run: sudo apt-get update && sudo apt-get install -y libx11-dev libpng-dev pkg-config

      - name: Configure
        run: cmake -S native/launcher/linux -B build/native-launcher-linux -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build/native-launcher-linux --parallel

      - name: Package launcher
        env:
          D2S_LICENSE_PUBLIC_KEY_JSON: ${{ vars.D2S_LICENSE_PUBLIC_KEY_JSON }}
        run: |
          test -n "$D2S_LICENSE_PUBLIC_KEY_JSON"
          node scripts/install-public-key.mjs src/desktop2stereo/auth/public_keys.py
          mkdir -p dist/Desktop2Stereo/src/desktop2stereo
          cp build/native-launcher-linux/Desktop2Stereo dist/Desktop2Stereo/src/
          cp src/desktop2stereo/main.py dist/Desktop2Stereo/src/desktop2stereo/
          cp -R src/desktop2stereo/app_runtime src/desktop2stereo/auth src/desktop2stereo/gui src/desktop2stereo/gui2 dist/Desktop2Stereo/src/desktop2stereo/
          cp src/desktop2stereo/d2s_blur.png dist/Desktop2Stereo/src/desktop2stereo/
          cp native/launcher/linux/README.md dist/Desktop2Stereo/
          node scripts/write-release-manifest.mjs dist/Desktop2Stereo

      - name: Upload Linux launcher
        uses: actions/upload-artifact@v4
        with:
          name: Desktop2Stereo-linux-launcher-${{ github.sha }}
          path: dist/Desktop2Stereo

  macos-launcher:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure universal build
        run: cmake -S native/launcher/macos -B build/native-launcher-macos -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES="x86_64;arm64"

      - name: Build
        run: cmake --build build/native-launcher-macos --config Release --parallel

      - name: Package launcher
        env:
          D2S_LICENSE_PUBLIC_KEY_JSON: ${{ vars.D2S_LICENSE_PUBLIC_KEY_JSON }}
        run: |
          test -n "$D2S_LICENSE_PUBLIC_KEY_JSON"
          node scripts/install-public-key.mjs src/desktop2stereo/auth/public_keys.py
          mkdir -p dist/Desktop2Stereo/src/desktop2stereo
          cp build/native-launcher-macos/Desktop2Stereo-macos dist/Desktop2Stereo/src/
          cp src/desktop2stereo/main.py dist/Desktop2Stereo/src/desktop2stereo/
          cp -R src/desktop2stereo/app_runtime src/desktop2stereo/auth src/desktop2stereo/gui src/desktop2stereo/gui2 dist/Desktop2Stereo/src/desktop2stereo/
          cp src/desktop2stereo/d2s_blur.png dist/Desktop2Stereo/src/desktop2stereo/
          cp native/launcher/macos/README.md dist/Desktop2Stereo/
          node scripts/write-release-manifest.mjs dist/Desktop2Stereo

      - name: Upload macOS launcher
        uses: actions/upload-artifact@v4
        with:
          name: Desktop2Stereo-macos-launcher-${{ github.sha }}
          path: dist/Desktop2Stereo
