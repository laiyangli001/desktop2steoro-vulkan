name: Build Windows NvFRUC Bridge

on:
  workflow_dispatch:
    inputs:
      sdk_ref:
        description: "Private SDK repository ref"
        required: false
        default: "main"
        type: string

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-nvfruc-bridge:
    name: Windows x64 NvFRUC bridge
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v5

      - name: Checkout private NvFRUC SDK repository
        uses: actions/checkout@v5
        with:
          repository: laiyangli001/desktop2stereo-nvfruc-sdk
          ref: ${{ inputs.sdk_ref }}
          ssh-key: ${{ secrets.NVOFFRUC_SDK_DEPLOY_KEY }}
          persist-credentials: false
          lfs: true
          path: .ci-nvfruc-sdk

      - name: Install CUDA compiler and runtime
        uses: Jimver/cuda-toolkit@v0.2.36
        with:
          cuda: "12.4.1"
          method: network
          sub-packages: '["nvcc", "cudart", "visual_studio_integration"]'

      - name: Locate NVIDIA Optical Flow SDK
        shell: pwsh
        run: |
          $archive = Get-ChildItem -LiteralPath .ci-nvfruc-sdk -Filter "Optical_Flow_SDK_*.zip" |
            Select-Object -First 1
          if (-not $archive) {
            throw "Optical Flow SDK archive was not found in the private dependency repository"
          }
          $sdkRoot = Join-Path $env:RUNNER_TEMP "optical-flow-sdk"
          Expand-Archive -LiteralPath $archive.FullName -DestinationPath $sdkRoot -Force
          $header = Get-ChildItem -LiteralPath $sdkRoot -Recurse -Filter NvOFFRUC.h |
            Select-Object -First 1
          if (-not $header) {
            throw "NvOFFRUC.h was not found in the SDK archive"
          }
          "D2S_NVOFFRUC_SDK_ROOT=$($header.Directory.Parent.FullName)" >> $env:GITHUB_ENV

      - name: Configure NvFRUC bridge
        shell: pwsh
        run: |
          cmake -S native/nvfruc_bridge -B native/nvfruc_bridge/build/ci -G "Visual Studio 17 2022" -A x64 "-DD2S_NVFRUC_SDK_ROOT=$env:D2S_NVOFFRUC_SDK_ROOT"

      - name: Build NvFRUC bridge
        shell: pwsh
        run: |
          cmake --build native/nvfruc_bridge/build/ci --config Release --parallel 2
          $bridge = "native/nvfruc_bridge/build/ci/Release/d2s_nvfruc_bridge.dll"
          if (-not (Test-Path -LiteralPath $bridge)) {
            throw "NvFRUC bridge was not produced: $bridge"
          }
          $runtime = Get-ChildItem -LiteralPath $env:D2S_NVOFFRUC_SDK_ROOT -Recurse -Filter NvOFFRUC.dll |
            Select-Object -First 1
          if (-not $runtime) {
            throw "NvOFFRUC.dll was not found in the SDK archive"
          }
          $artifact = Join-Path $env:RUNNER_TEMP "d2s-nvfruc-windows-x64"
          New-Item -ItemType Directory -Path $artifact -Force | Out-Null
          Copy-Item -LiteralPath $bridge -Destination $artifact
          Copy-Item -LiteralPath $runtime.FullName -Destination $artifact
          $manifest = [ordered]@{
            schema = 1
            platform = "windows-x64"
            bridge = "d2s_nvfruc_bridge.dll"
            runtime = "NvOFFRUC.dll"
            remote_build = "GitHub Actions windows-2022"
            sdk_header = "NvOFFRUC.h"
            sdk_not_in_repository = $true
          }
          $manifest | ConvertTo-Json | Set-Content -LiteralPath "$artifact\manifest.json" -Encoding utf8
          Get-ChildItem -LiteralPath $artifact -File |
            Where-Object { $_.Extension -ieq ".dll" } |
            ForEach-Object {
              [ordered]@{
                file = $_.Name
                sha256 = (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash
              }
            } | ConvertTo-Json | Set-Content -LiteralPath "$artifact\sha256.json" -Encoding utf8

      - name: Upload NvFRUC bridge artifact
        uses: actions/upload-artifact@v6
        with:
          name: d2s-nvfruc-windows-x64
          path: ${{ runner.temp }}/d2s-nvfruc-windows-x64/*
          if-no-files-found: error
